# Modo desenvolvimento: mesmo container "frontend", rodando `next dev` com hot reload.
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#      (ou .\iniciar.ps1 -Dev / ./iniciar.sh --dev)
services:
  # Perfil demo: cria o cliente de teste (cliente@exemplo.com) com galerias a partir das
  # fotos de exemplo e mostra o link de acesso na tela (dispensa e-mail em desenvolvimento)
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: demo
    volumes:
      - ./frontend/public/exemplos:/demo:ro

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      NODE_ENV: development
      # Windows/macOS: eventos de arquivo não atravessam o bind mount; polling resolve
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Mantém node_modules e .next do container (binários Linux), sem sobrescrever pelos do Windows
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/saude | grep -q UP || exit 1"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 10
