name: CI

# Deploy: feito pela integração Git do Vercel (push na main → produção; PR → preview).
# Este workflow só valida: lint, tipos, testes, build, teste de fumaça e Lighthouse.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um run por branch: um push novo cancela o anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Banco local PGlite (sem DATABASE_URL) e usuário do painel só para o CI
  ADMIN_EMAIL: ci@davifotovideo.test
  ADMIN_SENHA: senha-do-ci-123
  ADMIN_NOME: CI
  SITE_URL: http://localhost:3000

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Auditoria de dependências (produção)
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run tipos
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
      - name: Teste de fumaça (next start)
        run: |
          npm start &
          bash scripts/teste-fumaca.sh http://localhost:3000
      - name: Lighthouse (mobile)
        run: npx --yes @lhci/cli@0.16.0 autorun
      - name: Relatório do Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/
          if-no-files-found: ignore
