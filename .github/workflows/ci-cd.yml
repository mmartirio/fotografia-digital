name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um run por branch: um push novo cancela o anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testes de integração sobem um Postgres real via Testcontainers (Docker do runner)
      - name: Testes
        run: ./mvnw -B test
      - name: Relatórios dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-backend
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend (lint, tipos, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npx tsc --noEmit
      - name: Build de produção
        run: npm run build

  integracao:
    name: Integração (stack Docker + teste de fumaça)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      ADMIN_EMAIL: admin@ci.local
      ADMIN_SENHA: senha-do-ci-123
    steps:
      - uses: actions/checkout@v4
      - name: Configura .env
        run: |
          cp .env.example .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=ci-$(openssl rand -hex 12)/" .env
          sed -i "s/^ADMIN_EMAIL=.*/ADMIN_EMAIL=${ADMIN_EMAIL}/" .env
          sed -i "s/^ADMIN_SENHA=.*/ADMIN_SENHA=${ADMIN_SENHA}/" .env
      - name: Sobe frontend, backend e banco (imagens de produção)
        run: docker compose up -d --build --wait --wait-timeout 420
      - name: Teste de fumaça
        run: ./scripts/teste-fumaca.sh http://localhost:3000
      - name: Logs dos containers
        if: failure()
        run: docker compose logs --no-color
      - name: Derruba a stack
        if: always()
        run: docker compose down -v

  publicar:
    name: CD (publica imagens no GHCR)
    runs-on: ubuntu-latest
    needs: [integracao]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        servico: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push de ${{ matrix.servico }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.servico }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.servico }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.servico }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}
